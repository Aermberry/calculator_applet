<svg viewBox="0 0 680 580" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Flutter DDD 分层架构依赖图</title>
<desc>ui 依赖 application，application 依赖 domain，persistence 依赖 domain，domain 依赖 types 与 exceptions</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="580" fill="#FFFFFF"/>
<text x="340" y="26" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Flutter DDD 分层架构（箭头 = 依赖方向）</text>
<rect x="220" y="40" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">ui</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">page · presenter · view · widgets</text>
<path d="M340 96 L340 128" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="190" y="130" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">application</text>
<text x="340" y="168" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">原始输入 → entity / domain primitive</text>
<path d="M340 186 L340 208" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="210" width="440" height="190" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="260" y="232" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">domain（业务规则核心）</text>
<rect x="60" y="250" width="120" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="120" y="272" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">cqe</text>
<rect x="200" y="250" width="120" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="260" y="272" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">entity</text>
<rect x="340" y="250" width="120" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="400" y="272" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">service</text>
<rect x="130" y="310" width="120" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="190" y="332" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">facade</text>
<rect x="270" y="310" width="120" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="332" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">event</text>
<path d="M480 278 L518 278" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480 352 L518 352" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="520" y="250" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="580" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">types</text>
<text x="580" y="288" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">domain primitive</text>
<rect x="520" y="330" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="580" y="352" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">exceptions</text>
<path d="M200 438 L200 402" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="212" y="424" font-size="11" fill="#5F5E5A">依赖倒置：persistence 依赖 domain</text>
<path d="M480 490 L518 490" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="440" width="440" height="100" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="260" y="462" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#27500A">persistence</text>
<rect x="58" y="478" width="124" height="44" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<text x="120" y="500" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">repository</text>
<rect x="197" y="478" width="124" height="44" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<text x="259" y="494" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">http (chopper)</text>
<text x="259" y="510" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">dto</text>
<rect x="336" y="478" width="124" height="44" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<text x="398" y="494" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">sqlite · prefs</text>
<text x="398" y="510" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">secure storage</text>
<rect x="520" y="440" width="120" height="100" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="580" y="468" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#712B13">Packages</text>
<text x="580" y="486" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">防腐层</text>
<text x="580" y="504" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">sms · email</text>
<text x="580" y="520" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">redis …</text>
</svg>
